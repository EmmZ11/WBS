name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      BOOKER_USERNAME: ${{ secrets.BOOKER_USERNAME }}
      BOOKER_PASSWORD: ${{ secrets.BOOKER_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Run all test projects
        run: npx playwright test

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload JUnit results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-results
          path: test-results/junit.xml
          retention-days: 30

      - name: Write run summary
        if: ${{ !cancelled() }}
        run: |
          node -e '
            const x = require("fs").readFileSync("test-results/junit.xml", "utf8");
            const a = (n) => Number((x.match(new RegExp(`<testsuites[^>]* ${n}="([0-9]+)"`)) || [])[1] || 0);
            const lines = ["### Test results", "", "| Total | Failed | Skipped | Errors |", "|---|---|---|---|",
              `| ${a("tests")} | ${a("failures")} | ${a("skipped")} | ${a("errors")} |`, "",
              "Full HTML report: download the playwright-report artifact from this run."];
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          '
