name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned to commit SHAs (the version is in the comment).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Cheap checks first: no browser download if the code does not compile or lint.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run all test projects
        # Credentials are only visible to this step.
        env:
          CI: true
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          BOOKER_USERNAME: ${{ secrets.BOOKER_USERNAME }}
          BOOKER_PASSWORD: ${{ secrets.BOOKER_PASSWORD }}
        run: npx playwright test

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload JUnit results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-results
          path: test-results/junit.xml
          retention-days: 30

      - name: Write run summary
        if: ${{ !cancelled() }}
        run: |
          node -e '
            const fs = require("fs");
            const file = "test-results/junit.xml";
            if (!fs.existsSync(file)) {
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, "### Test results\n\nNo results: the tests did not run.\n");
              process.exit(0);
            }
            const x = fs.readFileSync(file, "utf8");
            const a = (n) => Number((x.match(new RegExp(`<testsuites[^>]* ${n}="([0-9]+)"`)) || [])[1] || 0);
            const lines = ["### Test results", "", "| Total | Failed | Errors | Skipped |", "|---|---|---|---|",
              `| ${a("tests")} | ${a("failures")} | ${a("errors")} | ${a("skipped")} |`, "",
              "Failures are expected: each one is a defect listed in BUG-REPORT.md.",
              "Full HTML report: download the playwright-report artifact from this run."];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          '
